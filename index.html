<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow — Modern To-Do List</title>
  <meta name="description" content="Taskflow is a sleek, modern to-do list app to help you organize your day with style." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient background blobs -->
  <div class="bg-blob blob-1" aria-hidden="true"></div>
  <div class="bg-blob blob-2" aria-hidden="true"></div>
  <div class="bg-blob blob-3" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
          <path d="M8 14.5L12 18.5L20 10.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#7C3AED"/>
              <stop offset="1" stop-color="#EC4899"/>
            </linearGradient>
          </defs>
        </svg>
        <h1>Taskflow</h1>
      </div>
      <div class="header-stats">
        <div class="stat" id="stat-pending">
          <span class="stat-number">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat" id="stat-done">
          <span class="stat-number">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>
    </header>

    <!-- Input area -->
    <form class="task-input-area" id="task-form">
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 6v8M6 10h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          id="task-input"
          placeholder="Add a new task…"
          autocomplete="off"
          maxlength="200"
        />
      </div>

      <!-- Category & Priority Selectors -->
      <div class="input-options">
        <div class="select-group">
          <label for="category-select" class="sr-only">Category</label>
          <select id="category-select">
            <option value="personal">🏠 Personal</option>
            <option value="work">💼 Work</option>
            <option value="health">💪 Health</option>
            <option value="learning">📚 Learning</option>
          </select>
        </div>
        <div class="select-group">
          <label for="priority-select" class="sr-only">Priority</label>
          <select id="priority-select">
            <option value="low">🟢 Low</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🔴 High</option>
          </select>
        </div>
        <button type="submit" class="btn-add" id="btn-add">
          <span>Add Task</span>
          <svg viewBox="0 0 20 20" fill="none" width="18" height="18">
            <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- Filter bar -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <div class="filter-indicator" id="filter-indicator"></div>
    </div>

    <!-- Task list -->
    <ul class="task-list" id="task-list" role="list">
      <!-- Tasks rendered here by JS -->
    </ul>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <svg class="empty-icon" viewBox="0 0 80 80" fill="none">
        <circle cx="40" cy="40" r="38" stroke="url(#empty-grad)" stroke-width="2" stroke-dasharray="6 4"/>
        <path d="M28 40h24M40 28v24" stroke="url(#empty-grad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <defs>
          <linearGradient id="empty-grad" x1="0" y1="0" x2="80" y2="80">
            <stop stop-color="#7C3AED"/>
            <stop offset="1" stop-color="#EC4899"/>
          </linearGradient>
        </defs>
      </svg>
      <p class="empty-title">No tasks yet</p>
      <p class="empty-subtitle">Add your first task to get started!</p>
    </div>

    <!-- Clear completed button -->
    <div class="actions-bar" id="actions-bar" style="display:none;">
      <button class="btn-clear" id="btn-clear">
        <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
          <path d="M4 6h12M8 6V4h4v2M6 6v10a2 2 0 002 2h4a2 2 0 002-2V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Clear Completed
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
